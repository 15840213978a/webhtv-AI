name: 双端手动APK构建和发布

on:
  workflow_dispatch:
    inputs:
      custom_package:
        description: '自定义包名（留空则使用项目原有包名，示例：com.example.app）'
        required: false
        default: 'com.fongmi.android.tv'

      app_name:
        description: '自定义应用名称'
        required: false
        default: '影视'

      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v5.5.7'

      release_notes:
        description: '更新日志说明'
        required: false
        default: '修复若干问题'

      create_release:
        description: '是否发布到 Releases'
        required: true
        default: 'true'
        type: boolean


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3



      - name: Modify app name
        if: ${{ github.event.inputs.app_name != '' }}
        run: |
          NEW_NAME="${{ github.event.inputs.app_name }}"
          ESCAPED_NAME=$(echo "$NEW_NAME" | sed 's/[&/\]/\\&/g')
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$ESCAPED_NAME<\/string>/g" {} \;



      - name: Modify applicationId
        if: ${{ github.event.inputs.custom_package != '' }}
        run: |
          PACKAGE="${{ github.event.inputs.custom_package }}"
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE\"/g" app/build.gradle



      - name: Modify versionName
        if: ${{ github.event.inputs.release_tag != '' }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          sed -i "s/versionName \".*\"/versionName \"$TAG\"/g" app/build.gradle



      # 四版本编译
      - name: Build APK
        run: |
          chmod +x gradlew

          ./gradlew \
          :app:assembleMobileArm64_v8aRelease \
          :app:assembleMobileArmeabi_v7aRelease \
          :app:assembleLeanbackArm64_v8aRelease \
          :app:assembleLeanbackArmeabi_v7aRelease



      - name: Prepare release assets
        id: prepare
        run: |

          mkdir -p release_assets


          find app/build/outputs/apk -name "*.apk" -type f | while read apk
          do
            cp "$apk" release_assets/
            echo "copy $apk"
          done


          APK_COUNT=$(find release_assets -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -lt 4 ]; then
            echo "APK数量不足"
            ls -la release_assets
            exit 1
          fi


          echo "APK列表:"
          ls -la release_assets



          VERSION_NAME=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle | head -1 | sed 's/[^0-9]*\([0-9]*\)/\1/')


          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT



          # 更新包固定选择手机版 arm64
          APK_FILE=$(ls release_assets/*mobile*arm64*.apk | head -1)

          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(stat -c%s "$APK_FILE")
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)



          DESC="${{ github.event.inputs.release_notes }}"

          cat > release_assets/manifest.json <<EOF
{
  "name":"${VERSION_NAME}",
  "desc":"${DESC}",
  "channel":"stable",
  "code":${VERSION_CODE},
  "apk":"${APK_NAME}",
  "size":${APK_SIZE},
  "sha256":"${APK_SHA256}"
}
EOF



      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: release_assets/



      - name: Create Release and Upload Assets
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ github.event.inputs.release_tag }}

          name: ${{ github.event.inputs.release_tag }}

          body: ${{ github.event.inputs.release_notes }}

          files: |
            release_assets/*.apk
            release_assets/manifest.json

          overwrite: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

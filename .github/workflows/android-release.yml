name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = auto"
        required: false
        type: string

      release_channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

      release_notes:
        description: "Release notes"
        required: false
        type: string

      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean


permissions:
  contents: write


env:
  TZ: Asia/Shanghai


jobs:

  release:

    name: Build and publish

    runs-on: ubuntu-latest

    timeout-minutes: 90


    steps:


      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"



      - name: Setup Android SDK
        uses: android-actions/setup-android@v3



      - name: Install SDK
        run: |
          sdkmanager \
          "platform-tools" \
          "platforms;android-37.0" \
          "build-tools;37.0.0"



      - name: Resolve version
        id: meta
        run: |

          VERSION_NAME=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle | head -1 | sed 's/[^0-9]*//g')


          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi


          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=${TAG#v}" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT



      - name: Configure signing
        env:

          KEYSTORE:
            ${{ secrets.WEBHTV_SIGNING_KEYSTORE_B64 }}

          STORE_PASSWORD:
            ${{ secrets.WEBHTV_SIGNING_STORE_PASSWORD }}

          KEY_ALIAS:
            ${{ secrets.WEBHTV_SIGNING_KEY_ALIAS }}

          KEY_PASSWORD:
            ${{ secrets.WEBHTV_SIGNING_KEY_PASSWORD }}

        run: |

          mkdir -p app/signing

          echo "$KEYSTORE" | base64 -d \
          > app/signing/release.jks


          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/app/signing/release.jks
          keyAlias=$KEY_ALIAS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF



      - name: Build APK

        run: |

          chmod +x gradlew

          ./gradlew \
          :app:assembleMobileArm64_v8aRelease \
          :app:assembleMobileArmeabi_v7aRelease \
          :app:assembleLeanbackArm64_v8aRelease \
          :app:assembleLeanbackArmeabi_v7aRelease \
          --no-daemon




      - name: Collect APK

        run: |

          rm -rf dist

          mkdir dist


          find app/build/outputs/apk \
          -name "*.apk" \
          -exec cp {} dist/ \;


          ls -lh dist/





      - name: Generate JSON manifests

        run: |

          python3 <<'PY'

          import os
          import glob
          import hashlib
          import json


          tag="${{ steps.meta.outputs.tag }}"


          base_url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"


          for apk in glob.glob("dist/*.apk"):

              name=os.path.basename(apk)


              with open(apk,"rb") as f:
                  data=f.read()


              manifest={
                "name":tag,
                "desc":"WebHTV Release",
                "code":int("${{ steps.meta.outputs.version_code }}"),
                "apk":f"{base_url}/{name}",
                "size":len(data),
                "sha256":hashlib.sha256(data).hexdigest()
              }


              json_name=name.replace(".apk",".json")


              with open(
                "dist/"+json_name,
                "w",
                encoding="utf-8"
              ) as f:

                  json.dump(
                    manifest,
                    f,
                    ensure_ascii=False,
                    indent=2
                  )

          PY





      - name: Create GitHub Release

        env:

          GH_TOKEN: ${{ github.token }}

        run: |


          gh release create \
          "${{ steps.meta.outputs.tag }}" \
          --title "${{ steps.meta.outputs.title }}" \
          --notes "${{ inputs.release_notes }}" \
          dist/*





      - name: Upload workflow artifacts

        uses: actions/upload-artifact@v4

        with:

          name: webhtv-${{ steps.meta.outputs.tag }}

          path: dist/*

          retention-days: 30
